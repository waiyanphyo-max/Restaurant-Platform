name: Backend CI

on:
  push:
    branches:
      - main
      - "ai/**"
  pull_request:
    paths:
      - "app/api/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Maven backend
        run: mvn --batch-mode --no-transfer-progress -f app/api/pom.xml clean verify
