server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  application:
    name: restaurant-platform

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER}
          jwk-set-uri: ${SUPABASE_JWKS_URL}
          audiences:
            - authenticated

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.restaurant.platform: INFO
    org.springframework.security: INFO

# Required environment variables:
# SUPABASE_DB_URL=jdbc:postgresql://<host>:<port>/postgres?sslmode=require
# SUPABASE_DB_USERNAME=<database username>
# SUPABASE_DB_PASSWORD=<database password>
# SUPABASE_AUTH_ISSUER=https://<project-ref>.supabase.co/auth/v1
# SUPABASE_JWKS_URL=https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
# DB_POOL_MAX_SIZE=5  # optional; default is 5
#
# Keep ddl-auto=validate: use Supabase SQL migrations as the schema source of truth.
# The JWKS configuration requires an asymmetric Supabase JWT signing key (e.g. ES256/RS256).

# Optional QR replay protection and provider-backed push delivery.
# Firebase delivery is disabled by default; enable only after the Firebase project/server credentials are configured.
app:
  public-web-base-url: ${APP_PUBLIC_WEB_BASE_URL:http://localhost:3000}
  security:
    # Comma-separated Supabase Auth user UUIDs allowed to provision restaurants.
    # Empty by default, which disables platform provisioning (fail closed).
    platform-admin-user-ids: ${PLATFORM_ADMIN_USER_IDS:}
  supabase-admin:
    project-url: ${SUPABASE_PROJECT_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    invite-redirect-url: ${SUPABASE_INVITE_REDIRECT_URL:http://localhost:3000/auth/accept-invite}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET_RESTAURANT_LOGOS:${SUPABASE_STORAGE_BUCKET:restaurant-logos}}
    menu-images-bucket: ${SUPABASE_STORAGE_BUCKET_MENU_IMAGES:menu-images}
    customer-avatars-bucket: ${SUPABASE_STORAGE_BUCKET_CUSTOMER_AVATARS:customer-avatars}
  idempotency:
    encryption-key: ${APP_IDEMPOTENCY_ENCRYPTION_KEY:}
  push:
    firebase:
      enabled: ${APP_PUSH_FIREBASE_ENABLED:false}
      service-account-json: ${APP_PUSH_FIREBASE_SERVICE_ACCOUNT_JSON:}
    outbox:
      poll-interval-ms: ${APP_PUSH_OUTBOX_POLL_INTERVAL_MS:5000}
      batch-size: ${APP_PUSH_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${APP_PUSH_OUTBOX_MAX_ATTEMPTS:8}
      max-retry-delay-seconds: ${APP_PUSH_OUTBOX_MAX_RETRY_DELAY_SECONDS:3600}
